<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMetrics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="brand">NovaMetrics</div>
            <button class="theme-toggle">Toggle Theme</button>
            <button class="nav-toggle">☰</button>
        </nav>
    </header>
    <aside class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li>Analytics</li>
            <li>Customers</li>
            <li>Reports</li>
            <li>Settings</li>
        </ul>
    </aside>
    <main class="main">
        <section class="hero">
            <h1>Welcome to NovaMetrics</h1>
            <p>Your comprehensive SaaS analytics dashboard.</p>
        </section>
        <section class="metrics">
            <div class="card">
                <h2>Monthly Revenue</h2>
                <p id="monthly-revenue">$0</p>
            </div>
            <div class="card">
                <h2>Active Users</h2>
                <p id="active-users">0</p>
            </div>
            <div class="card">
                <h2>Conversion Rate</h2>
                <p id="conversion-rate">0%</p>
            </div>
            <div class="card">
                <h2>Support Tickets</h2>
                <p id="support-tickets">0</p>
            </div>
        </section>
        <section class="charts">
            <div id="revenue-chart" class="chart"></div>
            <div id="user-activity-chart" class="chart"></div>
        </section>
        <section class="recent-customers">
            <h2>Recent Customers</h2>
            <input type="text" id="customer-search" placeholder="Search customers...">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="customer-table">
                    <!-- Sample data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
        <section class="activity-feed">
            <h2>Recent Activity</h2>
            <ul id="activity-feed">
                <!-- Sample data will be inserted here by JavaScript -->
            </ul>
        </section>
    </main>
</body>
</html>
