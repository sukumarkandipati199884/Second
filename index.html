<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskManager</div>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Welcome to TaskManager</h1>
            <p>Manage your projects and tasks efficiently.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat">
                    <h3>Projects</h3>
                    <p id="project-count">0</p>
                </div>
                <div class="stat">
                    <h3>Tasks</h3>
                    <p id="task-count">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <div id="project-list" class="list">
                <p>No projects available.</p>
            </div>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-controls">
                <button id="add-task">Add Task</button>
                <input type="text" id="task-search" placeholder="Search tasks...">
                <select id="task-filter">
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <div id="task-list" class="list">
                <p>No tasks available.</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 TaskManager. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
