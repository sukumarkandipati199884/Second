<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Task Manager</div>
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-list">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Manage Your Projects Efficiently</h1>
            <p>Keep track of tasks, deadlines, and progress with ease.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat">
                    <h3>Total Projects</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="stat">
                    <h3>Completed Tasks</h3>
                    <p id="completed-tasks">0</p>
                </div>
                <div class="stat">
                    <h3>Pending Tasks</h3>
                    <p id="pending-tasks">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <ul id="project-list">
                <!-- Project items will be dynamically added here -->
            </ul>
            <button id="add-project">Add Project</button>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-controls">
                <input type="text" id="task-search" placeholder="Search tasks...">
                <select id="priority-filter">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="complete">Complete</option>
                    <option value="incomplete">Incomplete</option>
                </select>
            </div>
            <ul id="task-list">
                <!-- Task items will be dynamically added here -->
            </ul>
            <p id="empty-task-list" class="empty-state">No tasks available. Add a new task to get started!</p>
            <button id="add-task">Add Task</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Task Manager</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
