<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Inventory Management Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#inventory">Inventory</a></li>
                <li><a href="#reports">Reports</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Items</h3>
                    <p id="total-items">0</p>
                </div>
                <div class="stat-card">
                    <h3>Low Stock Items</h3>
                    <p id="low-stock-items">0</p>
                </div>
                <div class="stat-card">
                    <h3>Categories</h3>
                    <p id="categories">0</p>
                </div>
            </div>
        </section>
        <section id="inventory">
            <h2>Inventory</h2>
            <div class="inventory-controls">
                <input type="text" id="search" placeholder="Search items...">
                <select id="filter-category">
                    <option value="">All Categories</option>
                </select>
                <select id="filter-stock">
                    <option value="">All Stock Status</option>
                    <option value="in-stock">In Stock</option>
                    <option value="low-stock">Low Stock</option>
                </select>
                <button id="add-item">Add Item</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-list">
                    <!-- Inventory items will be dynamically inserted here -->
                </tbody>
            </table>
            <div id="empty-state" class="hidden">No items found.</div>
        </section>
        <section id="reports">
            <h2>Inventory Reports</h2>
            <button id="generate-report">Generate Report</button>
            <div id="report-output">
                <!-- Report content will be dynamically inserted here -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Inventory Management Dashboard</p>
        <p>Contact: info@inventorydashboard.com</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
