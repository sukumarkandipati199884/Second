<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sales Analytics Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#summary">Summary</a></li>
                <li><a href="#monthly-sales">Monthly Sales</a></li>
                <li><a href="#category-performance">Category Performance</a></li>
                <li><a href="#recent-orders">Recent Orders</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="summary" class="summary-cards">
            <div class="card">
                <h2>Total Revenue</h2>
                <p id="total-revenue">$0</p>
            </div>
            <div class="card">
                <h2>Total Orders</h2>
                <p id="total-orders">0</p>
            </div>
            <div class="card">
                <h2>Average Order Value</h2>
                <p id="average-order-value">$0</p>
            </div>
            <div class="card">
                <h2>Total Customers</h2>
                <p id="total-customers">0</p>
            </div>
        </section>
        <section id="monthly-sales">
            <h2>Monthly Sales</h2>
            <canvas id="monthlySalesChart"></canvas>
        </section>
        <section id="category-performance">
            <h2>Product Category Performance</h2>
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="home">Home</option>
            </select>
            <canvas id="categoryPerformanceChart"></canvas>
        </section>
        <section id="recent-orders">
            <h2>Recent Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="recent-orders-table">
                    <!-- Sample data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
