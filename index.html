<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskManager</div>
            <button id="nav-toggle" aria-label="Toggle navigation">☰</button>
            <ul id="nav-menu">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Manage Your Projects Efficiently</h1>
            <p>Organize tasks, track progress, and collaborate with your team.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div id="project-stats">
                <div class="stat">
                    <h3>Total Projects</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="stat">
                    <h3>Completed Tasks</h3>
                    <p id="completed-tasks">0</p>
                </div>
                <div class="stat">
                    <h3>Pending Tasks</h3>
                    <p id="pending-tasks">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <ul id="project-list">
                <!-- Projects will be dynamically loaded here -->
            </ul>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <form id="task-form">
                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" required>
                <label for="task-priority">Priority</label>
                <select id="task-priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
            <ul id="task-list">
                <!-- Tasks will be dynamically loaded here -->
            </ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
