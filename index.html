<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMetrics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="brand">NovaMetrics</div>
            <button class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            <button class="nav-toggle" aria-label="Toggle Navigation">☰</button>
        </nav>
    </header>
    <aside class="sidebar">
        <ul>
            <li>Dashboard</li>
            <li>Analytics</li>
            <li>Customers</li>
            <li>Reports</li>
            <li>Settings</li>
        </ul>
    </aside>
    <main>
        <section class="metrics">
            <div class="metric-card">
                <h3>Monthly Revenue</h3>
                <p id="monthly-revenue">$0</p>
            </div>
            <div class="metric-card">
                <h3>Active Users</h3>
                <p id="active-users">0</p>
            </div>
            <div class="metric-card">
                <h3>Conversion Rate</h3>
                <p id="conversion-rate">0%</p>
            </div>
            <div class="metric-card">
                <h3>Support Tickets</h3>
                <p id="support-tickets">0</p>
            </div>
        </section>
        <section class="charts">
            <div class="chart" id="revenue-chart">
                <h3>Revenue Chart</h3>
                <canvas id="revenueCanvas"></canvas>
            </div>
            <div class="chart" id="user-activity-chart">
                <h3>User Activity</h3>
                <canvas id="activityCanvas"></canvas>
            </div>
        </section>
        <section class="recent-customers">
            <h3>Recent Customers</h3>
            <input type="text" id="customer-search" placeholder="Search Customers">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="customer-table">
                    <!-- Sample data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </section>
        <section class="activity-feed">
            <h3>Recent Activity</h3>
            <ul id="activity-feed">
                <!-- Sample activity data will be inserted here by JavaScript -->
            </ul>
        </section>
    </main>
</body>
</html>
