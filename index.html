<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskManager</div>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Welcome to TaskManager</h1>
            <p>Efficiently manage your projects and tasks with ease.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat-item">
                    <h3>Total Projects</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="stat-item">
                    <h3>Completed Tasks</h3>
                    <p id="completed-tasks">0</p>
                </div>
                <div class="stat-item">
                    <h3>Pending Tasks</h3>
                    <p id="pending-tasks">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <ul id="project-list">
                <!-- Project items will be dynamically added here -->
            </ul>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-controls">
                <input type="text" id="task-search" placeholder="Search tasks...">
                <select id="task-filter">
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <ul id="task-list">
                <!-- Task items will be dynamically added here -->
            </ul>
            <form id="task-form">
                <input type="text" id="task-name" placeholder="Task name" required>
                <input type="text" id="task-priority" placeholder="Priority" required>
                <button type="submit">Add Task</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 TaskManager. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
