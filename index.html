<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskManager</div>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Welcome to TaskManager</h1>
            <p>Manage your projects and tasks efficiently.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div id="project-stats">
                <!-- Project statistics will be dynamically loaded here -->
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <div id="project-list">
                <!-- Project list will be dynamically loaded here -->
            </div>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div id="task-controls">
                <button id="add-task">Add Task</button>
                <input type="text" id="search" placeholder="Search tasks...">
                <select id="filter-priority">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div id="task-list">
                <!-- Task list will be dynamically loaded here -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 TaskManager. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
