<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TaskManager</div>
            <button class="menu-toggle">☰</button>
            <ul class="nav-links">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Welcome to TaskManager</h1>
            <p>Manage your projects and tasks efficiently.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat">
                    <h3>Total Projects</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="stat">
                    <h3>Total Tasks</h3>
                    <p id="total-tasks">0</p>
                </div>
                <div class="stat">
                    <h3>Completed Tasks</h3>
                    <p id="completed-tasks">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <div id="project-list" class="project-list">
                <!-- Projects will be dynamically added here -->
            </div>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-controls">
                <input type="text" id="task-search" placeholder="Search tasks...">
                <select id="priority-filter">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="complete">Complete</option>
                    <option value="incomplete">Incomplete</option>
                </select>
            </div>
            <div id="task-list" class="task-list">
                <!-- Tasks will be dynamically added here -->
            </div>
            <button id="add-task-btn">Add Task</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 TaskManager. All rights reserved.</p>
    </footer>
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add/Edit Task</h2>
            <form id="task-form">
                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" required>
                <label for="task-priority">Priority</label>
                <select id="task-priority" required>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <label for="task-status">Status</label>
                <select id="task-status" required>
                    <option value="incomplete">Incomplete</option>
                    <option value="complete">Complete</option>
                </select>
                <button type="submit">Save Task</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
