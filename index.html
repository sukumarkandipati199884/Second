<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sales Analytics Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#summary">Summary</a></li>
                <li><a href="#charts">Charts</a></li>
                <li><a href="#orders">Recent Orders</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="summary" class="summary-cards">
            <div class="card">
                <h2>Total Revenue</h2>
                <p id="total-revenue">$0</p>
            </div>
            <div class="card">
                <h2>Total Orders</h2>
                <p id="total-orders">0</p>
            </div>
            <div class="card">
                <h2>Average Order Value</h2>
                <p id="average-order-value">$0</p>
            </div>
            <div class="card">
                <h2>Total Customers</h2>
                <p id="total-customers">0</p>
            </div>
        </section>
        <section id="charts">
            <div class="chart">
                <h2>Monthly Sales</h2>
                <canvas id="monthly-sales-chart"></canvas>
            </div>
            <div class="chart">
                <h2>Product Category Performance</h2>
                <canvas id="category-performance-chart"></canvas>
            </div>
        </section>
        <section id="orders">
            <h2>Recent Orders</h2>
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="home">Home</option>
            </select>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Sample data will be populated here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Sales Analytics Dashboard</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
