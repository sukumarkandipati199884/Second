<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Project Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Task Manager</div>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav no-search">
                <li class="nav-item"><a href="#dashboard">Dashboard</a></li>
                <li class="nav-item"><a href="#projects">Projects</a></li>
                <li class="nav-item"><a href="#tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Manage Your Projects Efficiently</h1>
            <p>Keep track of tasks and projects with ease.</p>
        </section>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="stats">
                <div class="stat">
                    <h3>Total Projects</h3>
                    <p id="total-projects">0</p>
                </div>
                <div class="stat">
                    <h3>Total Tasks</h3>
                    <p id="total-tasks">0</p>
                </div>
                <div class="stat">
                    <h3>Completed Tasks</h3>
                    <p id="completed-tasks">0</p>
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <ul id="project-list">
                <!-- Project items will be dynamically added here -->
            </ul>
        </section>
        <section id="tasks">
            <h2>Tasks</h2>
            <div class="task-controls">
                <input type="text" id="task-search" placeholder="Search tasks...">
                <select id="priority-filter">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <ul id="task-list">
                <!-- Task items will be dynamically added here -->
            </ul>
            <form id="task-form">
                <h3>Add New Task</h3>
                <input type="text" id="task-name" placeholder="Task Name" required>
                <input type="text" id="task-project" placeholder="Project Name" required>
                <select id="task-priority" required>
                    <option value="">Select Priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Task Manager</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
